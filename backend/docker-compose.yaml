services:
  api:
    build: .
    environment:
      POSTGRES_SERVER: db
      REDIS_HOST: redis
    expose:
      - 8000
    command: [ "fastapi", "run", "--port", "8000" ]
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
      - celery

  db:
    image: postgres
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "fastship"
    ports:
      - "5433:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql

  redis:
    image: redis:7
    volumes:
      - ./redis_data:/data

  celery:
    build: .
    command: ["celery", "-A", "app.worker.tasks", "worker", "--loglevel=INFO"]
    environment:
      REDIS_HOST: redis
